<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Заказы{% endblock %} — Студия 3D</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1><a href="{{ url_for('index') }}">Студия 3D</a></h1>
    <nav>
      <a href="{{ url_for('orders') }}">Заказы</a>
      <a href="{{ url_for('clients') }}">Клиенты</a>
      <a href="{{ url_for('services') }}">Услуги</a>
    </nav>
  </header>
  <main>
    {% for msg in get_flashed_messages() %}<div class="flash">{{ msg }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
