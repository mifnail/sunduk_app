{% extends "base.html" %}
{% block title %}{{ 'Редактирование клиента' if client else 'Новый клиент' }}{% endblock %}
{% block content %}
<h1>{{ 'Редактирование клиента' if client else 'Новый клиент' }}</h1>

<form method="post" class="form">
  <label>ФИО *
    <input type="text" name="full_name" required value="{{ client['full_name'] if client else '' }}">
  </label>

  <label>Телефон
    <input type="text" name="phone" value="{{ client['phone'] if client else '' }}" placeholder="+79001234567">
  </label>

  <label>Telegram ID
    <input type="text" name="telegram_id" value="{{ client['telegram_id'] if client else '' }}">
  </label>

  <label>VK ID
    <input type="text" name="vk_id" value="{{ client['vk_id'] if client else '' }}">
  </label>

  <label>MAX ID
    <input type="text" name="max_id" value="{{ client['max_id'] if client else '' }}">
  </label>

  <label>Заметки
    <textarea name="notes" rows="3">{{ client['notes'] if client else '' }}</textarea>
  </label>

  <fieldset>
    <legend>Каналы уведомлений</legend>
    {% for ch in ['telegram', 'vk', 'max'] %}
    <label class="checkbox">
      <input type="checkbox" name="channel_{{ ch }}" {% if channels and channels.get(ch) %}checked{% endif %}>
      {{ ch }}
    </label>
    {% endfor %}
  </fieldset>

  <button type="submit" class="btn btn-primary">Сохранить</button>
</form>
{% endblock %}
