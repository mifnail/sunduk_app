{% extends "base.html" %}
{% block title %}Услуги{% endblock %}
{% block content %}
<h1>Услуги</h1>

<table class="table">
  <thead>
    <tr><th>Название</th><th>Ед.</th><th>Цена</th><th></th></tr>
  </thead>
  <tbody>
    {% for s in services %}
    <tr>
      <td>{{ s['name'] }}</td>
      <td>{{ s['unit'] or '—' }}</td>
      <td>{{ "%.0f"|format(s['price'] or 0) }} ₽</td>
      <td>
        <form method="post" action="{{ url_for('services_update', service_id=s['id']) }}" class="inline">
          <input type="text" name="name" value="{{ s['name'] }}" required>
          <input type="text" name="unit" value="{{ s['unit'] or '' }}" placeholder="ед.">
          <input type="number" name="price" step="any" value="{{ s['price'] or '' }}" placeholder="цена">
          <button type="submit" class="btn btn-sm">Обновить</button>
        </form>
        <form method="post" action="{{ url_for('services_delete', service_id=s['id']) }}"
              class="inline" onsubmit="return confirm('Удалить услугу?')">
          <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="empty">Услуг нет</td></tr>
    {% endfor %}
  </tbody>
</table>

<h2>Новая услуга</h2>
<form method="post" action="{{ url_for('services_create') }}" class="form">
  <label>Название *
    <input type="text" name="name" required>
  </label>
  <label>Ед. измерения
    <input type="text" name="unit" placeholder="шт, г, см">
  </label>
  <label>Цена
    <input type="number" name="price" step="any">
  </label>
  <button type="submit" class="btn btn-primary">Добавить</button>
</form>
{% endblock %}
