{% extends "base.html" %}
{% block title %}Услуги{% endblock %}
{% block content %}
<h2>Услуги</h2>

<form method="post" action="{{ url_for('service_create') }}" class="card form row">
  <input type="text" name="name" placeholder="Название" required>
  <input type="text" name="unit" placeholder="Ед. изм. (шт, г)">
  <input type="number" step="0.01" name="price" placeholder="Цена">
  <button>Добавить</button>
</form>

<table>
  <thead><tr><th>Название</th><th>Ед. изм.</th><th>Цена</th><th></th></tr></thead>
  <tbody>
    {% for s in services %}
    <tr>
      <form method="post" action="{{ url_for('service_update', sid=s.id) }}" class="inline-row">
        <td><input type="text" name="name" value="{{ s.name }}" required></td>
        <td><input type="text" name="unit" value="{{ s.unit or '' }}"></td>
        <td><input type="number" step="0.01" name="price" value="{{ s.price or '' }}"></td>
        <td>
          <button class="small" type="submit">Сохранить</button>
          <form method="post" action="{{ url_for('service_delete', sid=s.id) }}" class="inline" style="display:inline">
            <button class="danger small" onclick="return confirm('Удалить услугу?')">Удалить</button>
          </form>
        </td>
      </form>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
